<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة مُعِين - نظام التزامن المباشر</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Firebase SDK للتزامن المباشر -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .a4-preview {
      width: 100%;
      max-width: 210mm;
      min-height: 297mm;
      padding: 10mm;
      margin: auto;
      background: white;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-16">

  <header class="bg-indigo-700 text-white p-4 shadow-lg">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">✨ منصة مُعِين (تزامن الكود اللحظي)</h1>
      <button onclick="openSyncModal()" class="bg-pink-500 hover:bg-pink-600 px-4 py-2 rounded-xl text-xs font-bold transition shadow">
        📲 كود التزامن (4 أرقام)
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
    <section class="bg-white p-4 rounded-2xl shadow-sm space-y-3">
      <label class="block text-xs font-bold text-slate-700">✍️ المحتوى النصي لورقة العمل:</label>
      <textarea id="sheetContent" rows="4" oninput="updatePreview()" class="w-full p-3 border rounded-lg text-xs" placeholder="اكتبي نص ورقة العمل هنا..."></textarea>
    </section>

    <section class="bg-white p-4 rounded-2xl shadow-sm">
      <h2 class="text-xs font-bold text-slate-700 mb-3">👁️ المعاينة الحية (A4):</h2>
      <div id="printableArea" class="a4-preview flex flex-col justify-between"></div>
    </section>
  </main>

  <!-- Modal التزامن -->
  <div id="syncModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-sm p-6 rounded-2xl shadow-2xl space-y-4">
      <h3 class="font-bold text-indigo-900 text-sm border-b pb-2">🌐 ربط التلفون بالكمبيوتر بكود</h3>
      
      <!-- القسم الأول: توليد الكود من التلفون -->
      <div class="p-3 bg-indigo-50 border border-indigo-200 rounded-xl text-center space-y-2">
        <p class="text-xs text-indigo-800 font-medium">إذا كنتِ على التلفون:</p>
        <button onclick="generateSyncCode()" id="genBtn" class="bg-pink-600 hover:bg-pink-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow w-full">
          ⚡ توليد كود جديد
        </button>
        <div id="codeDisplayBox" class="hidden mt-2 p-2 bg-white rounded-lg border border-indigo-300">
          <span class="text-[10px] text-slate-500 block">أدخلي هذا الرقم في الكمبيوتر:</span>
          <span id="syncCodeNum" class="font-mono text-3xl font-black text-indigo-900 tracking-widest">----</span>
        </div>
      </div>

      <!-- القسم الثاني: أدخل الكود على الكمبيوتر -->
      <div class="pt-2 border-t space-y-2">
        <label class="text-xs font-bold text-slate-700 block">إذا كنتِ على الكمبيوتر:</label>
        <div class="flex gap-2">
          <input type="text" id="codeInput" maxlength="4" placeholder="4 أرقام" class="flex-1 p-2 border rounded-lg text-xs font-mono text-center text-lg font-bold" />
          <button onclick="fetchByCode()" id="fetchBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition">📥 سحب</button>
        </div>
      </div>

      <div class="flex justify-end pt-2">
        <button onclick="closeSyncModal()" class="bg-slate-200 text-slate-700 px-4 py-1.5 rounded-lg text-xs font-bold">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    // تهيئة قاعدة البيانات السحابية (Firebase)
    const firebaseConfig = {
      databaseURL: "https://sync-demo-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function updatePreview() {
      const text = document.getElementById('sheetContent').value;
      const preview = document.getElementById('printableArea');
      if (!text.trim()) {
        preview.innerHTML = `<div class="text-center my-auto text-slate-400 text-xs">ستظهر المعاينة هنا...</div>`;
        return;
      }
      preview.innerHTML = `
        <div class="p-2 border-b text-[10px] text-slate-400 flex justify-between">
          <span>منصة مُعِين التعليمية</span>
          <span>الاسم: ..........................</span>
        </div>
        <div class="my-4 text-xs leading-relaxed whitespace-pre-wrap">${text}</div>
        <div class="text-center text-[10px] text-slate-400 border-t pt-2">صفحة A4 جاهزة للطباعة</div>
      `;
    }

    // 1️⃣ إرسال البيانات وتوليد كود من 4 أرقام (التلفون)
    function generateSyncCode() {
      const btn = document.getElementById('genBtn');
      btn.innerText = "جاري التوليد...";
      btn.disabled = true;

      // توليد كود من 4 أرقام
      const randomCode = Math.floor(1000 + Math.random() * 9000).toString();
      const content = document.getElementById('sheetContent').value;

      // حفظ البيانات تحت رقم الكود في السحابة
      db.ref('sessions/' + randomCode).set({
        content: content,
        timestamp: Date.now()
      }, (error) => {
        btn.innerText = "⚡ توليد كود جديد";
        btn.disabled = false;
        if (!error) {
          document.getElementById('syncCodeNum').innerText = randomCode;
          document.getElementById('codeDisplayBox').classList.remove('hidden');
        } else {
          alert("حدث خطأ في الاتصال بالسحابة!");
        }
      });
    }

    // 2️⃣ سحب البيانات باستخدام الكود (الكمبيوتر)
    function fetchByCode() {
      const code = document.getElementById('codeInput').value.trim();
      const btn = document.getElementById('fetchBtn');

      if (code.length !== 4) {
        alert("يرجى إدخال الكود المكون من 4 أرقام!");
        return;
      }

      btn.innerText = "جاري السحب...";
      btn.disabled = true;

      db.ref('sessions/' + code).once('value').then((snapshot) => {
        btn.innerText = "📥 سحب";
        btn.disabled = false;

        if (snapshot.exists()) {
          const data = snapshot.val();
          document.getElementById('sheetContent').value = data.content;
          updatePreview();
          closeSyncModal();
          alert("✅ تم سحب ورقة العمل بنجاح!");
        } else {
          alert("❌ الكود غير صحيح أو انتهت صلاحيته!");
        }
      }).catch(() => {
        btn.innerText = "📥 سحب";
        btn.disabled = false;
        alert("تعذر الاتصال بالشبكة!");
      });
    }

    function openSyncModal() { document.getElementById('syncModal').classList.remove('hidden'); document.getElementById('syncModal').classList.add('flex'); }
    function closeSyncModal() { document.getElementById('syncModal').classList.add('hidden'); }

    updatePreview();
  </script>
</body>
</html>
